services:
  - type: web_service
    name: animal-classifier-backend
    env: python
    root: backend
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT

  - type: static_site
    name: animal-classifier-frontend
    env: static
    root: frontend
    buildCommand: npm install && npm run build
    publishPath: build
